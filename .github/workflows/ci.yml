name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint check
        run: pnpm run lint:check

      - name: Format check
        run: pnpm run format:check

      - name: Build workspace
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Core tests
        run: pnpm --filter @hockpay/core test:ci

      - name: Infrastructure tests
        run: pnpm --filter @hockpay/infrastructure test

      - name: API tests
        run: pnpm --filter @hockpay/api test

      - name: Worker tests
        run: pnpm --filter @hockpay/worker test

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web tests
        run: pnpm --filter @hockpay/web test -- --watch=false

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: API e2e tests
        run: pnpm --filter @hockpay/api test:e2e

  # A garantia mais dificil do produto -- reserva de saldo sob concorrencia e
  # idempotencia sob corrida -- estava escrita e funcionando, mas fora do
  # default do smoke:docker e de qualquer job da CI: so rodava quando alguem
  # lembrava. Estas tres suites sao "api-only" (nao sobem worker nem checkout),
  # entao cabem num gate de PR.
  smoke-concurrency:
    name: Concurrency and isolation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run concurrency smoke suites
        run: |
          set -o pipefail
          mkdir -p artifacts/smoke-concurrency
          HOCKPAY_SMOKE_SUITE=db-concurrency,idempotency,idempotency-redis-unavailable \
          HOCKPAY_SMOKE_ARTIFACT_DIR=artifacts/smoke-concurrency \
            pnpm run smoke:docker 2>&1 | tee artifacts/smoke-concurrency/smoke.log

      # Sobe worker, entao nao cabe no job api-only acima. Roda no mesmo job
      # para reaproveitar o setup, e nao para economizar cobertura.
      - name: Run webhook isolation smoke
        run: |
          set -o pipefail
          mkdir -p artifacts/smoke-isolation
          HOCKPAY_SMOKE_SUITE=webhook-isolation \
          HOCKPAY_SMOKE_ARTIFACT_DIR=artifacts/smoke-isolation \
            pnpm run smoke:docker 2>&1 | tee artifacts/smoke-isolation/smoke.log

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-concurrency-diagnostics
          path: |
            artifacts/smoke-concurrency
            artifacts/smoke-isolation

  smoke-minimal:
    name: Minimal smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run minimal smoke suite
        run: |
          set -o pipefail
          mkdir -p artifacts/smoke
          HOCKPAY_SMOKE_SUITE=p0,payment-link HOCKPAY_SMOKE_ARTIFACT_DIR=artifacts/smoke pnpm run smoke:docker 2>&1 | tee artifacts/smoke/smoke.log

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: artifacts/smoke
