version: '3.8'

name: hockpay

services:
  postgres:
    image: postgres:15-alpine
    container_name: hockpay-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hockpay
      POSTGRES_PASSWORD: hockpay_dev_password
      POSTGRES_DB: hockpay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U hockpay' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hockpay-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: hockpay-postgres-data
  redis_data:
    name: hockpay-redis-data
