<header class="topbar">
  <button type="button" class="icon-btn menu-btn" (click)="openMenu.emit()" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>

  <nav class="crumbs" aria-label="Trilha">
    @for (crumb of crumbs(); track crumb.path; let first = $first) {
      @if (!first) {
        <span class="sep" aria-hidden="true">/</span>
      }
      @if (crumb.isLast) {
        <span class="crumb is-current" aria-current="page">{{ crumb.label }}</span>
      } @else {
        <a class="crumb" [routerLink]="crumb.path">{{ crumb.label }}</a>
      }
    }
  </nav>

  <div class="actions">
    <app-console-environment />

    <button
      type="button"
      class="icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="'Mudar para ' + nextSkin()"
      [title]="'Mudar para ' + nextSkin()"
    >
      @if (theme.resolved() === 'night') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>
  </div>
</header>
