<div class="shell">
  <app-console-rail class="shell-rail" />

  <div class="shell-main">
    <app-console-topbar (openMenu)="openDrawer()" />

    <main class="shell-scroll mer-scroll">
      <div class="shell-content">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!-- Os avisos moram na casca, e não na tela: uma ação pode terminar depois de
     o lojista já ter navegado, e o aviso precisa sobreviver à troca de rota. -->
<mer-toaster />

<!-- A gaveta do celular: o mesmo trilho, por cima do conteúdo. -->
@if (drawerOpen()) {
  <div class="drawer-scrim" (click)="closeDrawer()"></div>
  <div class="drawer">
    <app-console-rail variant="drawer" (navigated)="closeDrawer()" />
  </div>
}
