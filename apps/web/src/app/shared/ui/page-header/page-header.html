<header class="page-head">
  <div class="page-head-main">
    @if (backTo(); as back) {
      <a class="back group" [routerLink]="back">
        <ng-icon class="arrow-back" name="lucideArrowLeft" size="14px" strokeWidth="1.7" />
        {{ backLabel() }}
      </a>
    }

    @if (eyebrow(); as label) {
      <p class="eyebrow">{{ label }}</p>
    }

    <div class="page-title">
      <h1>{{ heading() }}</h1>
      <ng-content select="[pageStatus]" />
    </div>

    @if (description(); as text) {
      <p class="page-desc">{{ text }}</p>
    }
  </div>

  <div class="page-head-actions">
    <ng-content select="[pageActions]" />
  </div>
</header>
