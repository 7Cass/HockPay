<div class="h-screen flex w-full bg-zinc-50 overflow-hidden">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex flex-shrink-0 z-20 transition-all duration-200 ease-in-out"
        [class]="isSidebarCollapsed ? 'w-16 min-w-[64px]' : 'w-64 min-w-[256px]'">
        <app-sidebar (collapsedChange)="onSidebarCollapse($event)" class="w-full" />
    </aside>

    <!-- Mobile Sidebar Overlay -->
    @if (isMobileMenuOpen) {
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden" (click)="toggleMobileMenu()"></div>
    <aside class="fixed inset-y-0 left-0 w-64 z-50 lg:hidden shadow-xl">
        <app-sidebar class="w-full h-full" />
    </aside>
    }

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <header
            class="h-14 bg-white/80 backdrop-blur-sm border-b border-zinc-100 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-10">

            <!-- Left Side: Mobile Menu Toggle & Breadcrumbs -->
            <div class="flex items-center gap-3">
                <button (click)="toggleMobileMenu()"
                    class="lg:hidden p-2 -ml-2 rounded-lg text-zinc-500 hover:bg-zinc-100 hover:text-zinc-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>

                <!-- Breadcrumbs -->
                <nav class="hidden sm:flex items-center gap-1.5 text-sm font-medium">
                    @for (item of breadcrumbs(); track item.path; let isFirst = $first) {
                    @if (!isFirst) {
                    <ng-icon hlm name="lucideChevronRight" size="sm" class="text-zinc-400 mx-0.5"></ng-icon>
                    }
                    @if (item.isLast) {
                    <span class="text-zinc-900">{{ item.label }}</span>
                    } @else {
                    <span class="text-zinc-500">{{ item.label }}</span>
                    }
                    }
                </nav>
            </div>

            <!-- Right Side: Actions -->
            <div class="flex items-center gap-3">
                <!-- Dev Mode Indicator (Disabled Toggle) -->
                <div class="hidden sm:flex items-center gap-2 px-2.5 py-1.5 rounded-md bg-indigo-50/50 border border-indigo-200/50"
                    title="O sistema está operando em Sandbox">
                    <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></div>
                    <span class="text-xs font-semibold text-indigo-700">Dev Mode</span>
                    <hlm-switch class="ml-1 opacity-60" [checked]="true" [disabled]="true"></hlm-switch>
                </div>

                <div class="w-px h-5 bg-zinc-200 hidden sm:block"></div>

                <button
                    class="relative p-2 text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 rounded-lg transition-colors">
                    <ng-icon hlm name="lucideBell" size="sm"></ng-icon>
                    <!-- Notification Badge -->
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 border border-white"></span>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-auto p-4 lg:p-8">
            <div class="max-w-7xl mx-auto space-y-6">
                <router-outlet />
            </div>
        </main>
        <hlm-toaster position="bottom-right" richColors="true" />
    </div>
</div>
