<div class="shell" [class.is-collapsed]="shell.asideCollapsed()">
  <app-dashboard-sidebar class="shell-aside" />

  <div class="shell-main">
    <app-dashboard-topbar />

    <main class="shell-scroll scroll-thin">
      <div class="shell-content">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!-- ─── Gaveta no mobile ────────────────────────────────────────────────── -->
@if (shell.drawerOpen()) {
  <div class="drawer-scrim" (click)="shell.closeDrawer()"></div>
  <div class="drawer">
    <app-dashboard-sidebar variant="drawer" />
  </div>
}

@if (shell.commandOpen()) {
  <app-command-palette />
}

<hlm-toaster position="bottom-right" richColors="true" />
