<brn-dialog [closeDelay]="150" [state]="dialogState()" (closed)="onDialogClosed()">
    <ng-template brnDialogContent let-ctx>
        <brn-dialog-overlay class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm" />

        <div
            class="fixed left-[50%] top-[50%] z-50 w-full max-w-md translate-x-[-50%] translate-y-[-50%] bg-white rounded-xl border border-zinc-200 shadow-xl p-6">
            <!-- Close button -->
            <button (click)="ctx.close()"
                class="absolute right-4 top-4 rounded-md p-1 text-zinc-400 hover:text-zinc-600 hover:bg-zinc-100 transition-colors">
                <ng-icon hlm name="lucideX" size="sm"></ng-icon>
            </button>

            <app-dialog-header title="Nova Loja"
                description="Crie uma loja para começar a receber pagamentos simulados." />

            <form [formGroup]="form" (ngSubmit)="onSubmit(ctx)">
                <div class="grid gap-4">
                    <hlm-form-field>
                        <label hlmLabel for="store-name" class="text-zinc-700">Nome da Loja</label>
                        <input hlmInput id="store-name" formControlName="name" (input)="onNameInput()"
                            placeholder="Minha Loja"
                            class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500" />
                        <hlm-error>Informe o nome da loja.</hlm-error>
                    </hlm-form-field>

                    <hlm-form-field>
                        <label hlmLabel for="store-slug" class="text-zinc-700">Slug</label>
                        <input hlmInput id="store-slug" formControlName="slug" placeholder="minha-loja"
                            class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500 font-mono text-sm" />
                        <hlm-error>Slug deve conter apenas letras minúsculas, números e hífens (3-50
                            caracteres).</hlm-error>
                    </hlm-form-field>
                </div>

                <app-dialog-footer>
                    <button hlmBtn variant="outline" type="button" (click)="ctx.close()"
                        class="border-zinc-200 text-zinc-600 hover:bg-zinc-50">
                        Cancelar
                    </button>
                    <button hlmBtn type="submit" [disabled]="isLoading()"
                        class="bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">
                        @if (isLoading()) {
                        <ng-icon hlm name="lucideLoader2" size="sm" class="mr-2 animate-spin"></ng-icon>
                        Criando...
                        } @else {
                        Criar Loja
                        }
                    </button>
                </app-dialog-footer>
            </form>
        </div>
    </ng-template>
</brn-dialog>
