<app-sheet
  side="center"
  [open]="dialogState() === 'open'"
  (closed)="onDialogClosed()"
  heading="Nova loja"
  description="Cada loja tem saldo, chaves e webhooks próprios. O slug entra na URL do checkout."
>
  <form id="create-store-form" class="form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="field">
      <span class="field-label">Nome</span>
      <input id="store-name" formControlName="name" (input)="onNameInput()" placeholder="Ateliê Corvo" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">Informe o nome da loja.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Slug</span>
      <input id="store-slug" class="mono" formControlName="slug" placeholder="atelie-corvo" />
      @if (form.controls.slug.invalid && form.controls.slug.touched) {
        <span class="field-error">Minúsculas, números e hífens, de 3 a 50 caracteres.</span>
      } @else {
        <span class="field-note">Sugerido a partir do nome. Dá para trocar.</span>
      }
    </label>
  </form>

  <ng-container sheetActions>
    <button type="button" class="btn btn-quiet" (click)="close()" [disabled]="isLoading()">
      Cancelar
    </button>
    <button type="submit" form="create-store-form" class="btn btn-ink" [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner spinner-sm"></span>
      }
      Criar loja
    </button>
  </ng-container>
</app-sheet>
