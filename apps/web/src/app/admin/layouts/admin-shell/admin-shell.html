<div class="shell">
  <app-admin-rail
    [operator]="operatorAuth.currentOperator()"
    [isLeaving]="isLeaving()"
    (search)="openPalette()"
    (shortcuts)="isShortcutsOpen.set(true)"
    (leave)="logout()"
  />

  <div class="work">
    <header class="topbar">
      <span class="crumbs">
        <span class="crumb-root">Mesa</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb-now">{{ section() }}</span>
      </span>

      <span class="topbar-actions">
        <button
          admButton
          type="button"
          variant="ghost"
          size="sm"
          (click)="openPalette()"
          aria-label="Buscar (comando K)"
          title="Buscar — ⌘K"
        >
          <ng-icon name="lucideCommand" size="13px" strokeWidth="1.8" aria-hidden="true" />
          <span class="topbar-search-label">Buscar</span>
        </button>

        <button
          admButton
          type="button"
          variant="ghost"
          size="sm"
          iconOnly
          (click)="theme.toggleTheme()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'"
          [title]="theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'"
        >
          <ng-icon
            [name]="theme.theme() === 'dark' ? 'lucideSun' : 'lucideMoon'"
            size="14px"
            strokeWidth="1.8"
          />
        </button>
      </span>
    </header>

    <main class="canvas adm-scroll">
      <div class="canvas-inner">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<adm-command-palette
  [open]="isPaletteOpen()"
  [commands]="commands()"
  (queryChange)="onPaletteQuery($event)"
  (closed)="isPaletteOpen.set(false)"
/>

@if (isShortcutsOpen()) {
  <adm-sheet
    [open]="true"
    side="center"
    heading="Atalhos"
    description="A mesa foi desenhada para ser operada sem tirar a mão do teclado."
    (closed)="isShortcutsOpen.set(false)"
  >
    <dl class="shortcuts">
      <div>
        <dt><adm-kbd>⌘</adm-kbd><adm-kbd>K</adm-kbd></dt>
        <dd>Buscar destino, ação ou id de loja</dd>
      </div>
      @for (item of nav; track item.route) {
        <div>
          <dt>
            <adm-kbd>g</adm-kbd><adm-kbd>{{ item.key }}</adm-kbd>
          </dt>
          <dd>Ir para {{ item.label }} — {{ item.hint }}</dd>
        </div>
      }
      <div>
        <dt><adm-kbd>?</adm-kbd></dt>
        <dd>Esta lista</dd>
      </div>
      <div>
        <dt><adm-kbd>esc</adm-kbd></dt>
        <dd>Fechar o painel aberto</dd>
      </div>
    </dl>
  </adm-sheet>
}

<adm-toaster />
