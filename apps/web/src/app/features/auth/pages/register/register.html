<div class="mx-auto flex w-full flex-col justify-center space-y-8 sm:w-[350px]">
    <div class="flex flex-col space-y-2 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Crie sua conta</h1>
        <p class="text-sm font-medium text-zinc-500">Informe os dados abaixo para se cadastrar</p>
    </div>

    <div class="grid gap-6">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="grid gap-5">
                <hlm-form-field>
                    <label hlmLabel for="name" class="text-zinc-900">Nome completo</label>
                    <input hlmInput id="name" formControlName="name" placeholder="João Silva" type="text"
                        autocapitalize="words" autocorrect="off"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500" />
                    <hlm-error>Nome deve ter entre 2 e 100 caracteres.</hlm-error>
                </hlm-form-field>

                <hlm-form-field>
                    <label hlmLabel for="email" class="text-zinc-900">Email</label>
                    <input hlmInput id="email" formControlName="email" placeholder="nome@empresa.com" type="email"
                        autocapitalize="none" autocomplete="email" autocorrect="off"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500" />
                    <hlm-error>Insira um e-mail válido.</hlm-error>
                </hlm-form-field>

                <hlm-form-field>
                    <label hlmLabel for="document" class="text-zinc-900">Documento (CPF / CNPJ)</label>
                    <input hlmInput id="document" formControlName="document" placeholder="000.000.000-00" type="text"
                        mask="000.000.000-00||00.000.000/0000-00"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500" />
                    <hlm-error>Insira um documento válido.</hlm-error>
                </hlm-form-field>

                <hlm-form-field>
                    <label hlmLabel for="password" class="text-zinc-900">Senha</label>
                    <input hlmInput id="password" formControlName="password" type="password"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white focus-visible:ring-indigo-500" />
                    <hlm-error>A senha deve ter pelo menos 8 caracteres.</hlm-error>
                </hlm-form-field>

                <hlm-form-field>
                    <label hlmLabel for="confirm-password" class="text-zinc-900">Confirmar Senha</label>
                    <input hlmInput id="confirm-password" formControlName="confirmPassword" type="password"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white focus-visible:ring-indigo-500" />
                    <hlm-error>As senhas não coincidem.</hlm-error>
                </hlm-form-field>

                <button hlmBtn
                    class="w-full mt-2 h-11 bg-indigo-600 text-white hover:bg-indigo-700 font-semibold rounded-lg shadow-sm transition-all"
                    type="submit" [disabled]="isLoading()">
                    @if (isLoading()) {
                    <ng-icon hlm name="lucideLoader2" class="mr-2 h-4 w-4 animate-spin"></ng-icon>
                    Cadastrando...
                    } @else {
                    Cadastrar
                    }
                </button>
            </div>
        </form>

    </div>

    <p class="px-8 text-center text-sm font-medium text-zinc-500">
        Já tem uma conta?
        <a routerLink="/login"
            class="font-semibold text-indigo-600 hover:text-indigo-700 underline-offset-4 hover:underline">
            Fazer login
        </a>
    </p>
</div>
