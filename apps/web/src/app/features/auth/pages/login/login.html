<p appReveal class="eyebrow">
  <span class="pulse-dot"></span>
  Entrar
</p>

<h1
  [appReveal]="60"
  class="mt-6 font-display text-[clamp(2.1rem,6vw,2.9rem)] leading-[0.98] tracking-[-0.02em] text-ink"
>
  De volta ao <em class="italic">laboratório.</em>
</h1>

<p [appReveal]="110" class="mt-4 text-[15px] leading-[1.65] text-ink-soft">
  Entre para abrir seu dashboard, suas chaves e a fila de webhooks.
</p>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-9 space-y-5" novalidate>
  <div [appReveal]="160" class="field">
    <label class="field-label" for="email">E-mail</label>
    <div class="control">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="voce@empresa.com"
        autocomplete="email"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        [attr.aria-invalid]="showError('email')"
      />
    </div>
    @if (showError('email')) {
      <span class="field-error" role="alert">informe um e-mail válido</span>
    }
  </div>

  <div [appReveal]="200" class="field">
    <label class="field-label" for="password">Senha</label>
    <div class="control with-toggle">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showError('password')"
      />
      <button
        type="button"
        class="toggle"
        [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="showPassword()"
        (click)="togglePassword()"
      >
        <ng-icon
          hlm
          [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'"
          size="16px"
          aria-hidden="true"
        />
      </button>
    </div>
    @if (showError('password')) {
      <span class="field-error" role="alert">a senha é obrigatória</span>
    }
  </div>

  <div [appReveal]="240" class="pt-1">
    <button type="submit" class="btn-ink" [disabled]="isLoading()">
      @if (isLoading()) {
        <ng-icon name="lucideLoader2" size="16px" class="animate-spin" aria-hidden="true" />
        Entrando…
      } @else {
        Entrar
        <ng-icon name="lucideArrowRight" size="16px" class="arrow" aria-hidden="true" />
      }
    </button>
  </div>
</form>

<p [appReveal]="290" class="mt-8 text-[13.5px] text-ink-soft">
  Ainda não tem conta?
  <a routerLink="/register" class="link">Criar minha sandbox</a>
</p>

<p [appReveal]="320" class="mt-3 font-code text-[11px] tracking-[0.06em] text-ink-faint">
  suas chaves TEST continuam onde você deixou
</p>
