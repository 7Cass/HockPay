<div class="mx-auto flex w-full flex-col justify-center space-y-8 sm:w-[350px]">
    <div class="flex flex-col space-y-2 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Acesse sua conta</h1>
        <p class="text-sm font-medium text-zinc-500">Informe seu email e senha para entrar</p>
    </div>

    <div class="grid gap-6">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="grid gap-5">
                <hlm-form-field>
                    <label hlmLabel for="email" class="text-zinc-900">Email</label>
                    <input hlmInput id="email" formControlName="email" placeholder="nome@empresa.com" type="email"
                        autocapitalize="none" autocomplete="email" autocorrect="off"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white placeholder:text-zinc-400 focus-visible:ring-indigo-500" />
                    <hlm-error>Insira um e-mail válido.</hlm-error>
                </hlm-form-field>

                <hlm-form-field>
                    <div class="flex items-center justify-between">
                        <label hlmLabel for="password" class="text-zinc-900">Senha</label>
                    </div>
                    <input hlmInput id="password" formControlName="password" type="password"
                        class="bg-white border-zinc-200 text-zinc-900 h-10 ring-offset-white focus-visible:ring-indigo-500" />
                    <hlm-error>A senha é obrigatória.</hlm-error>
                </hlm-form-field>

                <button hlmBtn
                    class="w-full mt-2 h-11 bg-indigo-600 text-white hover:bg-indigo-700 font-semibold rounded-lg shadow-sm transition-all"
                    type="submit" [disabled]="isLoading()">
                    @if (isLoading()) {
                    <ng-icon hlm name="lucideLoader2" class="mr-2 h-4 w-4 animate-spin"></ng-icon>
                    Entrando...
                    } @else {
                    Entrar
                    }
                </button>
            </div>
        </form>

    </div>

    <p class="px-8 text-center text-sm font-medium text-zinc-500">
        Ainda não tem uma conta?
        <a routerLink="/register"
            class="font-semibold text-indigo-600 hover:text-indigo-700 underline-offset-4 hover:underline">
            Cadastre-se
        </a>
    </p>
</div>
