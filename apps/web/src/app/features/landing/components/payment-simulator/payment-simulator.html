<div class="stage">
  <div class="copy"><ng-content /></div>

  <div class="organism">
    <app-organic-blob [mood]="status()" data-cursor="escolha um final">
      <div class="core" [attr.data-status]="status()">
        <p class="core-label">Cobrança Pix</p>
        <p class="core-amount">R$ 250,00</p>
        <p class="core-state" role="status" aria-live="polite">{{ face().label }}</p>
        <p class="core-meta">
          {{ status() === 'pending' ? 'expira em ' + clock() : chargeId }}
        </p>
      </div>
    </app-organic-blob>
  </div>

  <div class="deck">
    <div class="deck-head">
      <p class="deck-label">Escolha o final</p>
      <p class="deck-hint">{{ face().caption }}</p>
    </div>

    <ol>
      @for (outcome of outcomes; track outcome.id; let i = $index) {
        <li class="choice-row">
          <button
            type="button"
            class="choice"
            appMagnetic="0.08"
            [attr.data-tone]="outcome.tone"
            [attr.data-cursor]="outcome.action + '()'"
            [class.is-active]="status() === outcome.id"
            [disabled]="locked()"
            (click)="settle(outcome.id)"
          >
            <span class="choice-n">0{{ i + 1 }}</span>
            <span class="choice-label">{{ outcome.label }}</span>
            <span class="choice-code">{{ outcome.action }}()</span>
            <svg class="choice-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </li>
      }
    </ol>

    <button type="button" class="reset" [disabled]="locked()" (click)="reset()">
      <span class="reset-icon" aria-hidden="true">↺</span> reset()
    </button>
  </div>

  <app-event-receipt class="receipt" [lines]="events()" [status]="status()" />
</div>
